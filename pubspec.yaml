name: wedstyle
description: "WedStyle - Premium Indian Wedding Fashion Marketplace with AI Virtual Try-On"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  lottie: ^3.1.3
  animate_do: ^3.3.4
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  image_picker: ^1.1.2
  percent_indicator: ^4.2.3
  flutter_staggered_grid_view: ^0.7.0
  readmore: ^3.0.0
  photo_view: ^0.15.0

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.3.0

  # Network
  http: ^1.2.2
  dio: ^5.7.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/bridal/
    - assets/icons/
    - assets/animations/
